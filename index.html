<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工具站 — Markdown / JSON / 二维码</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3d8bfd;
      --accent-dim: rgba(61, 139, 253, 0.15);
      --error: #f87171;
      --success: #34d399;
      --font-sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-mono: "Cascadia Code", "JetBrains Mono", "Fira Code", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
    }

    .app {
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }

    header {
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    nav {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    nav button {
      font-family: inherit;
      font-size: 0.875rem;
      padding: 0.5rem 1rem;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }

    nav button:hover {
      color: var(--text);
      background: var(--accent-dim);
    }

    nav button.active {
      color: var(--text);
      background: var(--accent-dim);
      border-color: var(--accent);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 1rem;
      gap: 0.75rem;
    }

    .panel-hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      min-height: 0;
    }

    @media (max-width: 900px) {
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(200px, 40vh) 1fr;
      }
    }

    .pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
    }

    .pane-header {
      padding: 0.5rem 0.85rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.2);
    }

    .pane-header.row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .pane-header.row span.label {
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .btn-tool {
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: none;
      letter-spacing: normal;
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--accent-dim);
      color: var(--accent);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-tool:hover {
      background: rgba(61, 139, 253, 0.28);
      border-color: var(--accent);
    }

    .btn-tool:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    textarea.editor {
      flex: 1;
      width: 100%;
      min-height: 280px;
      padding: 1rem;
      border: none;
      resize: none;
      font-family: var(--font-mono);
      font-size: 0.875rem;
      line-height: 1.55;
      background: var(--bg);
      color: var(--text);
      outline: none;
    }

    .preview {
      flex: 1;
      min-height: 280px;
      padding: 1rem 1.15rem;
      overflow: auto;
      font-size: 0.9375rem;
      line-height: 1.65;
    }

    .preview.markdown-body h1,
    .preview.markdown-body h2,
    .preview.markdown-body h3 {
      margin-top: 1.25em;
      margin-bottom: 0.5em;
      font-weight: 600;
    }

    .preview.markdown-body h1 { font-size: 1.75rem; border-bottom: 1px solid var(--border); padding-bottom: 0.35em; }
    .preview.markdown-body h2 { font-size: 1.35rem; }
    .preview.markdown-body p { margin: 0.65em 0; }
    .preview.markdown-body code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--bg);
      padding: 0.15em 0.4em;
      border-radius: 4px;
    }
    .preview.markdown-body pre {
      background: var(--bg);
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      border: 1px solid var(--border);
    }
    .preview.markdown-body pre code {
      padding: 0;
      background: none;
    }
    .preview.markdown-body ul, .preview.markdown-body ol {
      padding-left: 1.5rem;
    }
    .preview.markdown-body blockquote {
      margin: 0.75em 0;
      padding-left: 1rem;
      border-left: 4px solid var(--accent);
      color: var(--muted);
    }
    .preview.markdown-body a {
      color: var(--accent);
    }
    .preview.markdown-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
    }
    .preview.markdown-body th, .preview.markdown-body td {
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
    }

    .preview.json-ok {
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
    }

    .preview.json-err {
      font-family: var(--font-mono);
      font-size: 0.875rem;
      color: var(--error);
      white-space: pre-wrap;
    }

    .preview.placeholder {
      color: var(--muted);
      font-style: italic;
    }

    .tool-section {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0;
    }

    .tool-section.active {
      display: flex;
    }

    .qr-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.15);
    }

    .qr-toolbar label {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .qr-toolbar input[type="number"] {
      width: 4.5rem;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
    }

    #qrcode-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 240px;
      padding: 1.5rem;
    }

    #qrcode-wrap:empty::after {
      content: "在左侧输入文本，二维码将显示在这里";
      color: var(--muted);
      font-style: italic;
      text-align: center;
    }

    #qrcode-wrap img {
      display: block;
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <span class="brand">工具站</span>
      <nav id="nav">
        <button type="button" data-tool="md" class="active">Markdown → HTML</button>
        <button type="button" data-tool="json">JSON 格式化 / 校验</button>
        <button type="button" data-tool="qr">二维码生成</button>
      </nav>
    </header>

    <main>
      <!-- Markdown -->
      <section id="tool-md" class="tool-section active">
        <p class="panel-hint">左侧编写 Markdown，右侧实时渲染为 HTML（已做基础消毒）。预览栏可「导出 HTML」下载独立网页文件。</p>
        <div class="workspace">
          <div class="pane">
            <div class="pane-header">编辑</div>
            <textarea id="md-input" class="editor" spellcheck="false" placeholder="# 标题&#10;&#10;试试 **粗体** 和 `代码`…"></textarea>
          </div>
          <div class="pane">
            <div class="pane-header row">
              <span class="label">预览</span>
              <button type="button" id="btn-export-html" class="btn-tool">导出 HTML</button>
            </div>
            <div id="md-preview" class="preview markdown-body placeholder">预览将显示在这里</div>
          </div>
        </div>
      </section>

      <!-- JSON -->
      <section id="tool-json" class="tool-section">
        <p class="panel-hint">粘贴 JSON，右侧显示格式化结果；语法错误时显示错误信息。</p>
        <div class="workspace">
          <div class="pane">
            <div class="pane-header">原始 JSON</div>
            <textarea id="json-input" class="editor" spellcheck="false" placeholder='{"hello": "world"}'></textarea>
          </div>
          <div class="pane">
            <div class="pane-header">结果</div>
            <div id="json-preview" class="preview placeholder">格式化后的 JSON 或错误信息</div>
          </div>
        </div>
      </section>

      <!-- QR -->
      <section id="tool-qr" class="tool-section">
        <p class="panel-hint">输入网址或任意文本，右侧实时生成二维码；可调整尺寸。生成后可「下载 PNG」保存图片。</p>
        <div class="workspace">
          <div class="pane">
            <div class="pane-header">内容与选项</div>
            <div class="qr-toolbar">
              <label>边长(px) <input type="number" id="qr-size" min="64" max="512" value="200" /></label>
            </div>
            <textarea id="qr-input" class="editor" spellcheck="false" placeholder="https://example.com 或任意文本"></textarea>
          </div>
          <div class="pane">
            <div class="pane-header row">
              <span class="label">预览</span>
              <button type="button" id="btn-download-qr" class="btn-tool" disabled>下载 PNG</button>
            </div>
            <div id="qrcode-wrap" class="preview" style="display:flex;align-items:center;justify-content:center;"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    (function () {
      const nav = document.getElementById("nav");
      const sections = {
        md: document.getElementById("tool-md"),
        json: document.getElementById("tool-json"),
        qr: document.getElementById("tool-qr"),
      };

      nav.addEventListener("click", function (e) {
        const btn = e.target.closest("button[data-tool]");
        if (!btn) return;
        const key = btn.getAttribute("data-tool");
        nav.querySelectorAll("button").forEach(function (b) {
          b.classList.toggle("active", b === btn);
        });
        Object.keys(sections).forEach(function (k) {
          sections[k].classList.toggle("active", k === key);
        });
      });

      /* Markdown */
      const mdInput = document.getElementById("md-input");
      const mdPreview = document.getElementById("md-preview");

      function renderMarkdown() {
        const raw = mdInput.value;
        if (!raw.trim()) {
          mdPreview.className = "preview markdown-body placeholder";
          mdPreview.textContent = "预览将显示在这里";
          return;
        }
        let html = "";
        try {
          html = typeof marked !== "undefined" && marked.parse
            ? marked.parse(raw, { async: false })
            : "";
        } catch (err) {
          mdPreview.className = "preview json-err";
          mdPreview.textContent = "解析错误: " + (err && err.message ? err.message : String(err));
          return;
        }
        const clean =
          typeof DOMPurify !== "undefined" && DOMPurify.sanitize
            ? DOMPurify.sanitize(html)
            : html;
        mdPreview.className = "preview markdown-body";
        mdPreview.innerHTML = clean;
      }

      mdInput.addEventListener("input", renderMarkdown);
      renderMarkdown();

      function getSanitizedMdHtml() {
        const raw = mdInput.value.trim();
        if (!raw) return null;
        try {
          const html =
            typeof marked !== "undefined" && marked.parse
              ? marked.parse(raw, { async: false })
              : "";
          return typeof DOMPurify !== "undefined" && DOMPurify.sanitize
            ? DOMPurify.sanitize(html)
            : html;
        } catch (e) {
          return null;
        }
      }

      function triggerDownloadBlob(blob, filename) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.rel = "noopener";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () {
          URL.revokeObjectURL(a.href);
        }, 2000);
      }

      function triggerDownloadUrl(url, filename) {
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.rel = "noopener";
        document.body.appendChild(a);
        a.click();
        a.remove();
      }

      document.getElementById("btn-export-html").addEventListener("click", function () {
        const innerHtml = getSanitizedMdHtml();
        if (!innerHtml) {
          alert("请先输入有效的 Markdown 内容。");
          return;
        }
        const exportCss = `
          * { box-sizing: border-box; }
          body { margin: 0; padding: 1.5rem; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            font-size: 16px; line-height: 1.65; color: #1a1a1a; background: #fafafa; }
          main.markdown-body { max-width: 48rem; margin: 0 auto; }
          .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin-top: 1.25em; margin-bottom: 0.5em; font-weight: 600; }
          .markdown-body h1 { font-size: 1.75rem; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.35em; }
          .markdown-body h2 { font-size: 1.35rem; }
          .markdown-body p { margin: 0.65em 0; }
          .markdown-body code { font-family: Consolas, "Cascadia Code", monospace; font-size: 0.88em;
            background: #f3f4f6; padding: 0.15em 0.4em; border-radius: 4px; }
          .markdown-body pre { background: #1f2937; color: #f3f4f6; padding: 1rem; border-radius: 8px; overflow-x: auto; }
          .markdown-body pre code { padding: 0; background: none; color: inherit; }
          .markdown-body ul, .markdown-body ol { padding-left: 1.5rem; }
          .markdown-body blockquote { margin: 0.75em 0; padding-left: 1rem; border-left: 4px solid #3b82f6; color: #4b5563; }
          .markdown-body a { color: #2563eb; }
          .markdown-body table { border-collapse: collapse; width: 100%; margin: 1em 0; }
          .markdown-body th, .markdown-body td { border: 1px solid #e5e7eb; padding: 0.5rem 0.75rem; }
        `.trim();
        const doc =
          "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\" />\n" +
          "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n" +
          "<title>Markdown 导出</title>\n<style>\n" +
          exportCss +
          "\n</style>\n</head>\n<body>\n<main class=\"markdown-body\">\n" +
          innerHtml +
          "\n</main>\n</body>\n</html>";
        const blob = new Blob([doc], { type: "text/html;charset=utf-8" });
        triggerDownloadBlob(blob, "markdown-export.html");
      });

      /* JSON */
      const jsonInput = document.getElementById("json-input");
      const jsonPreview = document.getElementById("json-preview");

      function formatJson() {
        const t = jsonInput.value.trim();
        if (!t) {
          jsonPreview.className = "preview placeholder";
          jsonPreview.textContent = "格式化后的 JSON 或错误信息";
          return;
        }
        try {
          const obj = JSON.parse(t);
          const pretty = JSON.stringify(obj, null, 2);
          jsonPreview.className = "preview json-ok";
          jsonPreview.textContent = pretty;
        } catch (err) {
          jsonPreview.className = "preview json-err";
          jsonPreview.textContent =
            "无效 JSON\n\n" + (err && err.message ? err.message : String(err));
        }
      }

      jsonInput.addEventListener("input", formatJson);
      formatJson();

      /* QR Code */
      const qrInput = document.getElementById("qr-input");
      const qrSize = document.getElementById("qr-size");
      const qrcodeWrap = document.getElementById("qrcode-wrap");
      const btnDownloadQr = document.getElementById("btn-download-qr");
      let qrInstance = null;

      function setQrDownloadEnabled(on) {
        btnDownloadQr.disabled = !on;
      }

      function updateQr() {
        const text = qrInput.value.trim();
        const size = Math.min(512, Math.max(64, parseInt(qrSize.value, 10) || 200));
        qrcodeWrap.innerHTML = "";
        qrInstance = null;
        setQrDownloadEnabled(false);
        if (!text) return;
        if (typeof QRCode === "undefined") {
          qrcodeWrap.innerHTML =
            '<span class="placeholder" style="font-style:italic">二维码库加载失败，请检查网络</span>';
          return;
        }
        const div = document.createElement("div");
        qrcodeWrap.appendChild(div);
        qrInstance = new QRCode(div, {
          text: text,
          width: size,
          height: size,
          colorDark: "#111827",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M,
        });
        setQrDownloadEnabled(true);
      }

      btnDownloadQr.addEventListener("click", function () {
        const canvas = qrcodeWrap.querySelector("canvas");
        const img = qrcodeWrap.querySelector("img");
        if (canvas) {
          if (canvas.toBlob) {
            canvas.toBlob(function (blob) {
              if (blob) triggerDownloadBlob(blob, "qrcode.png");
            }, "image/png");
          } else {
            triggerDownloadUrl(canvas.toDataURL("image/png"), "qrcode.png");
          }
          return;
        }
        if (img && img.src) {
          triggerDownloadUrl(img.src, "qrcode.png");
          return;
        }
        alert("请先在左侧输入内容以生成二维码。");
      });

      qrInput.addEventListener("input", updateQr);
      qrSize.addEventListener("input", updateQr);
      qrSize.addEventListener("change", updateQr);
      updateQr();
    })();
  </script>
</body>
</html>
